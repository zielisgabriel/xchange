# Perfil de testes de integração.
# Sobrescreve o datasource para H2 em memória e desabilita as dependências
# externas (Redis e cache) — os limites externos são mockados via @MockitoBean.
# Ativado em conjunto com o perfil "dev" para carregar o SecurityConfigDev.
spring:
  datasource:
    url: jdbc:h2:mem:xchange;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false

jwt:
  secret-key: "integration-test-secret-key-with-at-least-256-bits-of-length-0123456789"

coingecko:
  api-key: "test-coingecko-api-key"
